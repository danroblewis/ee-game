[package]
name = "sim-golden"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sim-core = { path = "../sim-core" }
# The scale bench times factor and solve separately, so it drives the LU
# kernel directly rather than through the engine.
sim-math = { path = "../sim-math" }

[dev-dependencies]
libm.workspace = true
# The photocell test asserts what a saved document does and does NOT carry
# (a reading is `serde(skip)`), which needs the serde impls the server uses.
sim-core = { path = "../sim-core", features = ["serde"] }
serde_json.workspace = true
# Adversarial verification asserts against the REAL damage ladder rather
# than a copy of its numbers.
damage = { path = "../damage" }
