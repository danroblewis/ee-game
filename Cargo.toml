[workspace]
resolver = "2"
members = [
    "crates/sim-math",
    "crates/sim-core",
    "crates/sim-golden",
    "crates/sim-layout",
    "crates/sim-wasm",
    "crates/machine",
    "crates/damage",
    "crates/server",
    "crates/sim-gpu-spike",
]
# Standalone measurement crates (docs/scale-parallelism.md). Excluded on
# purpose: their dependencies (rayon, wgpu) must never reach a shipping
# crate or the workspace lockfile.
exclude = [
    "tools/scale-bench",
    "tools/gpu-bench",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
libm = "0.2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"

# Determinism: never enable fast-math or FMA contraction anywhere.
[profile.release]
opt-level = 3
lto = "thin"

[profile.release.package.sim-wasm]
opt-level = 3
