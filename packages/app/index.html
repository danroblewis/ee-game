<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EE Game — M1 demo</title>
    <style>
      html, body { margin: 0; height: 100%; background: #101014; overflow: hidden; }
      #canvas { display: block; width: 100vw; height: 100vh; cursor: default; }
      #hud {
        position: fixed; top: 10px; left: 12px; color: #9a9aa5;
        font: 12px/1.5 ui-monospace, monospace; pointer-events: none;
        white-space: pre;
      }
      #tip {
        position: fixed; display: none; color: #e8e8ef; background: #1c1c24e6;
        border: 1px solid #33333f; border-radius: 4px; padding: 6px 8px;
        font: 12px/1.5 ui-monospace, monospace; pointer-events: none;
        white-space: pre;
      }
      #palette {
        position: fixed; top: 54px; left: 12px; width: 220px; display: none;
        background: #16161de6; border: 1px solid #33333f; border-radius: 6px;
        padding: 8px; font: 13px/1.6 ui-monospace, monospace;
      }
      #psearch {
        width: 100%; box-sizing: border-box; background: #0f0f14; color: #e8e8ef;
        border: 1px solid #3a3a48; border-radius: 4px; padding: 5px 8px;
        font: inherit; outline: none;
      }
      #plist { max-height: 320px; overflow-y: auto; margin-top: 6px; }
      #plist div { color: #c9c9d4; padding: 2px 6px; border-radius: 3px; cursor: pointer; }
      #plist div:hover, #plist div.sel { background: #2a2a3a; color: #fff; }
      #pbtn {
        position: fixed; top: 12px; right: 12px; background: #1c1c24e6;
        color: #c9c9d4; border: 1px solid #33333f; border-radius: 6px;
        padding: 6px 12px; font: 13px ui-monospace, monospace; cursor: pointer;
      }
      #pbtn:hover { background: #2a2a3a; color: #fff; }
      #scope {
        position: fixed; left: 0; right: 0; bottom: 0; height: 190px;
        display: none; background: #101016f2; border-top: 1px solid #2c2c38;
      }
      #scopecv { width: 100%; height: 100%; display: block; }
      #props {
        position: fixed; top: 54px; right: 12px; width: 240px; display: none;
        background: #16161de6; border: 1px solid #33333f; border-radius: 6px;
        padding: 10px; font: 13px/1.7 ui-monospace, monospace; color: #c9c9d4;
      }
      #props h3 { margin: 0 0 6px; font-size: 13px; color: #fff; font-weight: 600; }
      #props label { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
      #props input[type=number], #props input[type=text] {
        width: 110px; background: #0f0f14; color: #e8e8ef; border: 1px solid #3a3a48;
        border-radius: 4px; padding: 2px 6px; font: inherit; outline: none;
      }
      #props .row { display: flex; gap: 6px; margin-top: 8px; }
      #props button {
        flex: 1; background: #22222c; color: #c9c9d4; border: 1px solid #3a3a48;
        border-radius: 4px; padding: 4px 0; font: inherit; cursor: pointer;
      }
      #props button:hover { background: #2e2e3c; color: #fff; }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="hud"></div>
    <div id="tip"></div>
    <div id="scope"><canvas id="scopecv"></canvas></div>
    <div id="props"></div>
    <button id="pbtn">+ part&nbsp;&nbsp;(/)</button>
    <div id="palette">
      <input id="psearch" placeholder="search parts…" autocomplete="off" />
      <div id="plist"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
