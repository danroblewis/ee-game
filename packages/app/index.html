<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EE Game — M1 demo</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23101014'/%3E%3Cpath d='M4 20h6l3-9 4 14 3-9h8' fill='none' stroke='%234bff6a' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <style>
      html, body { margin: 0; height: 100%; background: #101014; overflow: hidden; }
      /* How much viewport the HUD chrome is eating. panel.ts writes the two
         rail values, dock.ts the scope dock's height; every screen-anchored
         overlay below is positioned off them, so nothing has to know about
         anything else's geometry. */
      :root { --rail-l: 0px; --rail-r: 0px; --dock-h: 24px; }
      #canvas { display: block; width: 100vw; height: 100vh; cursor: default; }
      /* The hint block used to be bare text over the world, so it smeared
         across anything it happened to sit in front of. Give it its own
         backdrop: chrome should read as chrome. */
      #hud {
        position: fixed; top: 8px; left: calc(8px + var(--rail-l)); color: #9a9aa5;
        font: 12px/1.5 ui-monospace, monospace; pointer-events: none;
        white-space: pre; padding: 4px 9px; border-radius: 6px;
        background: #0d0d12d9; border: 1px solid #23232c;
        max-width: calc(100vw - 320px - var(--rail-l) - var(--rail-r)); overflow: hidden;
      }
      #scope {
        position: fixed; left: 0; right: 0; bottom: 0; height: 24px;
        display: none; background: #101016f2; border-top: 1px solid #2c2c38;
      }
      #scopebar {
        height: 24px; box-sizing: border-box; padding: 0 10px; overflow: hidden;
        display: flex; align-items: center; gap: 14px; white-space: nowrap;
        color: #8a8a98; font: 11px/24px ui-monospace, monospace;
        cursor: ns-resize; user-select: none; -webkit-user-select: none;
      }
      #scope:not(.collapsed) #scopebar { border-bottom: 1px solid #2c2c38; }
      #scope.collapsed #scopebar { cursor: pointer; }
      #scopebar:hover { color: #c9c9d4; }
      #scopecaret { color: #c9c9d4; flex: none; }
      #scopesum { display: flex; gap: 14px; overflow: hidden; }
      /* Global sound controls: mute + volume, parked at the right end of the
         same strip. Their own cursor, because the strip's is ns-resize. */
      #scopeaudio {
        display: none; align-items: center; gap: 8px; flex: none;
        margin-left: auto; cursor: default;
      }
      #audiomute {
        background: #22222c; color: #c9c9d4; border: 1px solid #3a3a48;
        border-radius: 4px; font: 11px/1 ui-monospace, monospace; padding: 3px 6px;
        cursor: pointer; min-width: 74px;
      }
      #audiomute:hover { background: #2e2e3c; }
      #audiomute.off { border-color: #6a3a3a; background: #2a1c1c; }
      #audiovol { width: 74px; accent-color: #8ee7ff; cursor: pointer; }
      #audiolabel { color: #6e6e7e; flex: none; }
      #audiolabel.warn { color: #ffd66b; }
      /* Buffer telemetry: dim while healthy, amber when thin or the sim is
         dilated, red once audio was actually lost. */
      #audiobuf { color: #5c5c6a; flex: none; font-variant-numeric: tabular-nums; }
      #audiobuf.warn { color: #ffd66b; }
      #audiobuf.bad { color: #ff8f8f; }
      #scopecv { width: 100%; height: calc(100% - 24px); display: block; }
      #scope.collapsed #scopecv { display: none; }
      #props, #propsdlg {
        position: fixed; width: 240px; display: none;
        background: #16161de6; border: 1px solid #33333f; border-radius: 6px;
        padding: 10px; font: 13px/1.7 ui-monospace, monospace; color: #c9c9d4;
      }
      #props { top: 54px; right: calc(12px + var(--rail-r)); }
      /* THE ON-CANVAS RENAME BOX. A label box and a net label have no window
         to hold a title field, so the field comes to them: it is parked over
         the very plate it is editing, sized like it, and it is the only DOM
         either primitive owns. */
      #nameedit {
        position: fixed; display: none; z-index: 35;
        background: #0d0d13; color: #e8e8f0;
        border: 1px solid #6a6a80; border-radius: 4px;
        padding: 1px 5px; font: 11px/1.4 ui-monospace, monospace;
        outline: none; min-width: 70px;
      }
      #nameedit:focus { border-color: #8ee7ff; }
      /* Floating editor: same box, parked next to the part by double-click. */
      #propsdlg {
        left: 0; top: 0; z-index: 30; background: #17171ef7;
        border-color: #454558; box-shadow: 0 8px 28px #000a;
      }
      #props h3, #propsdlg h3 {
        margin: 0 0 6px; font-size: 13px; color: #fff; font-weight: 600;
        display: flex; justify-content: space-between; align-items: center; gap: 8px;
      }
      #props label, #propsdlg label {
        display: flex; justify-content: space-between; align-items: center; gap: 8px;
      }
      #props input[type=number], #props input[type=text],
      #propsdlg input[type=number], #propsdlg input[type=text] {
        width: 110px; background: #0f0f14; color: #e8e8ef; border: 1px solid #3a3a48;
        border-radius: 4px; padding: 2px 6px; font: inherit; outline: none;
      }
      /* Value entry is text now, so prefixes can be typed ("4k7", "100n").
         `.bad` marks a value this field's own range refuses. */
      #props input.bad, #propsdlg input.bad { border-color: #ff8f8f; color: #ff8f8f; }
      /* The note under a field: the rejection reason, or — only when the
         player has opted into standard values — the nearest stock part. */
      #props .pnote, #propsdlg .pnote {
        font-size: 11px; line-height: 1.45; color: #7a7a88;
        margin: -3px 0 3px; text-align: right; min-height: 0;
      }
      #props .pnote:empty, #propsdlg .pnote:empty { display: none; }
      #props .pnote.err, #propsdlg .pnote.err { color: #ff8f8f; text-align: left; }
      #props .pnote.good, #propsdlg .pnote.good { color: #7dffb0; }
      #props .pnote .snap, #propsdlg .pnote .snap {
        color: #7dffb0; border-bottom: 1px dotted #7dffb0; cursor: pointer;
      }
      #props .pnote .why, #propsdlg .pnote .why { cursor: pointer; color: #8a8a98; }
      #props .pnote .why:hover, #propsdlg .pnote .why:hover { color: #fff; }
      #props .pnote .explain, #propsdlg .pnote .explain {
        text-align: left; margin-top: 6px; padding: 6px 8px; color: #c9c9d4;
        background: #0f0f14; border: 1px solid #33333f; border-radius: 4px;
      }
      #props .pnote .explain p, #propsdlg .pnote .explain p { margin: 0 0 6px; }
      #props .pnote .explain p:first-child, #propsdlg .pnote .explain p:first-child {
        color: #fff; font-weight: 600;
      }
      #props .pnote .explain p:last-child, #propsdlg .pnote .explain p:last-child { margin: 0; }
      #props .row, #propsdlg .row { display: flex; gap: 6px; margin-top: 8px; }
      #props button, #propsdlg button {
        flex: 1; background: #22222c; color: #c9c9d4; border: 1px solid #3a3a48;
        border-radius: 4px; padding: 4px 0; font: inherit; cursor: pointer;
      }
      #props button:hover, #propsdlg button:hover { background: #2e2e3c; color: #fff; }
      #propsdlg h3 .xbtn {
        flex: 0 0 auto; background: none; border: none; color: #8a8a98;
        font: 16px/1 ui-monospace, monospace; padding: 0 2px; cursor: pointer;
      }
      #propsdlg h3 .xbtn:hover { background: none; color: #fff; }
      /* Cascading context menu: a transparent layer holding one panel per level. */
      #ctxmenu { position: fixed; inset: 0; display: none; z-index: 40; pointer-events: none; }
      #ctxmenu .ctxpanel {
        position: absolute; pointer-events: auto; min-width: 172px;
        background: #16161df7; border: 1px solid #33333f; border-radius: 6px;
        padding: 4px; font: 13px/1.6 ui-monospace, monospace;
        box-shadow: 0 8px 28px #000a;
      }
      #ctxmenu .mi {
        display: flex; align-items: center; gap: 14px; justify-content: space-between;
        color: #c9c9d4; padding: 3px 8px; border-radius: 3px; cursor: pointer;
        white-space: nowrap;
      }
      #ctxmenu .mi:hover, #ctxmenu .mi.open { background: #2a2a3a; color: #fff; }
      /* Submenu rows get a caret and no keyboard-hint column. */
      #ctxmenu .mi.sub::after { content: '›'; color: #7a7a8a; font-size: 15px; line-height: 1; }
      #ctxmenu .mi.sub:hover::after, #ctxmenu .mi.open::after { color: #fff; }
      #ctxmenu .kb { color: #6e6e7e; font-size: 11px; }
      #ctxmenu .mi:hover .kb { color: #a8a8b8; }
      #ctxmenu .hd { color: #6e6e7e; padding: 2px 8px 4px; font-size: 11px; }
      #ctxmenu .sep { height: 1px; background: #2c2c38; margin: 4px 2px; }

      /* ---- HUD rails: the home a control panel can be dropped into ----
         Two collapsible sidebars (panel.ts owns all state). They OVERLAY the
         canvas — the camera stays window-sized — but they swallow their own
         pointer events, so a click in a rail never reaches the schematic.
         Hidden entirely while a side holds nothing: a player who has never
         pressed J must see no new chrome. */
      .rail {
        position: fixed; top: 0; bottom: var(--dock-h); z-index: 15;
        display: none; flex-direction: column; box-sizing: border-box;
        pointer-events: auto; background: #14181deb;
        border-right: 1px solid #2c343d;
      }
      #rail-right { right: 0; border-right: none; border-left: 1px solid #2c343d; }
      #rail-left { left: 0; }
      .rail.on { display: flex; }
      /* The strip: click toggles, and it is the only thing left when closed. */
      .rail-bar {
        flex: none; height: 24px; box-sizing: border-box; padding: 0 6px;
        display: flex; align-items: center; gap: 8px; cursor: pointer;
        color: #8a8a98; font: 11px/24px ui-monospace, monospace; overflow: hidden;
        white-space: nowrap; user-select: none; -webkit-user-select: none;
        background: none; border: none; border-bottom: 1px solid #2c343d; width: 100%;
        text-align: left;
      }
      .rail-bar:hover { color: #c9c9d4; }
      .rail-caret { color: #c9c9d4; flex: none; }
      .rail-count { flex: 1 1 auto; overflow: hidden; }
      /* Collapsed, the strip IS the rail: the whole 24 px column stays
         clickable and says how many panels are folded away in it. */
      .rail.collapsed .rail-bar {
        flex: 1 1 auto; height: auto; flex-direction: column;
        justify-content: flex-start; gap: 10px; padding: 5px 2px;
        border-bottom: none;
      }
      .rail.collapsed .rail-count {
        flex: none; writing-mode: vertical-rl; letter-spacing: 0.06em;
      }
      .rail-list {
        flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; padding: 6px;
        display: flex; flex-direction: column;
      }
      .rail.collapsed .rail-list, .rail.collapsed .rail-grip { display: none; }
      .rail-grip { position: absolute; top: 24px; bottom: 0; width: 6px; cursor: ew-resize; }
      #rail-left .rail-grip { right: -3px; }
      #rail-right .rail-grip { left: -3px; }
      /* Armed = a window is in the air and this side would take it. Flash =
         it just landed in this (shut) rail — same look, opposite tense. */
      .rail.armed, .rail.flash { border-color: #4ad4ff; box-shadow: inset 0 0 0 1px #4ad4ff33; }
      .rail.armed .rail-bar, .rail.flash .rail-bar { color: #8ee7ff; }
      .rail-caretline {
        flex: none; height: 2px; background: #8ee7ff; border-radius: 1px;
        margin: 3px 1px; box-shadow: 0 0 6px #8ee7ff99; display: none;
      }
      .rail-caretline.on { display: block; }

      /* ---- control panels: floating instrument windows (panel.ts) ---- */
      #panels { position: fixed; inset: 0; pointer-events: none; z-index: 16; }
      /* A docked window gives up absolute positioning and its drop shadow —
         it is furniture in the rail, not a thing floating over the world. */
      .pwin.docked {
        position: static; width: auto; flex: none; margin: 0 0 8px;
        box-shadow: none; border-radius: 6px;
      }
      .pwin.dragging { z-index: 46; opacity: 0.94; }
      /* A window in the air rides above the goal card and the toasts, or you
         cannot see what you are aiming at. */
      #panels:has(.pwin.dragging) { z-index: 45; }
      /* Reverse highlight: the canvas pointer is on something this panel owns. */
      .pwin.hot { border-color: #4ad4ff; }
      .prow.hot { background: #16262e; box-shadow: inset 2px 0 0 #8ee7ff; }
      /* Header tail: fold · dock · delete. The FOLD button carries the auto
         margin now, so it (not ×) marks the end of the drag strip — panel.ts
         measures against it in fitTitle. */
      .pwin-shut {
        background: none; border: none; color: #6f8290; margin-left: auto;
        font: 11px/1 ui-monospace, monospace; cursor: pointer; padding: 0 2px;
      }
      .pwin-shut:hover { color: #cfe3ee; }
      .pwin-dock {
        background: none; border: none; color: #6f8290;
        font: 13px/1 ui-monospace, monospace; cursor: pointer; padding: 0 2px;
      }
      .pwin-dock:hover { color: #8ee7ff; }
      .pwin-shut ~ .pwin-x { margin-left: 0; }
      .pwin.shut .pwin-body, .pwin.empty .pwin-body { display: none; }
      .pwin.shut .pwin-hd, .pwin.empty .pwin-hd { border-bottom: none; border-radius: 7px; }
      .pwin {
        position: absolute; pointer-events: auto; width: 300px; color: #c9d6de;
        font: 12px/1.5 ui-monospace, monospace;
        background: linear-gradient(#232830, #171b21);
        border: 1px solid #3c4653; border-radius: 8px;
        box-shadow: 0 10px 28px #000a, inset 0 1px 0 #ffffff14;
      }
      .pwin-hd {
        display: flex; align-items: center; gap: 6px; padding: 1px 6px 1px 8px;
        cursor: move; border-bottom: 1px solid #2c343d;
        background: linear-gradient(#2b323c, #212730);
        border-radius: 7px 7px 0 0; position: relative;
      }
      .pwin-grab { color: #5d6b78; cursor: move; }
      /* The name field is sized to its text by panel.ts (never flex: 1), so
         the header space to its right is real, grabbable title bar. */
      .pwin-title, .pwin-mez {
        font: 600 11px ui-monospace, monospace; letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .pwin-title {
        flex: 0 0 auto; width: 96px; min-width: 0; background: transparent;
        border: 1px solid transparent; border-radius: 3px; color: #dff0f8;
        padding: 1px 4px; outline: none; cursor: text;
      }
      .pwin-title:hover { border-color: #3c4653; }
      .pwin-title:focus { border-color: #4ad4ff; background: #10151a; text-transform: none; }
      /* Hidden twin: measuring the name is what keeps the drag strip exactly
         where the text ends as the panel is renamed. */
      .pwin-mez {
        position: absolute; left: 0; top: 0; visibility: hidden; white-space: pre;
        pointer-events: none; padding: 0; border: 0;
      }
      .pwin-mez.raw { text-transform: none; }
      .pwin-x {
        background: none; border: none; color: #6f8290; font: 15px/1 ui-monospace, monospace;
        cursor: pointer; padding: 0 3px; margin-left: auto;
      }
      .pwin-x:hover { color: #ff8f8f; }
      .pwin-body { padding: 4px 0; }
      .prow {
        display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
        padding: 4px 8px 4px 4px; border-bottom: 1px solid #232a32;
      }
      .prow:last-child { border-bottom: none; }
      .prow.dragging { background: #2b3a44; }
      .prow-grip { color: #4e5c68; cursor: grab; padding: 0 2px; touch-action: none; }
      .prow-grip:hover { color: #8fa2b0; }
      .prow-label { flex: 0 0 82px; color: #8ea3b1; font-size: 11px; letter-spacing: 0.04em; }
      .prow-ctl { flex: 1 1 110px; display: flex; align-items: center; gap: 6px; min-width: 0; }
      .prow-val {
        flex: 0 0 auto; min-width: 76px; text-align: right; color: #cfe3ee;
        font-variant-numeric: tabular-nums;
      }
      .pslider { flex: 1 1 auto; min-width: 60px; accent-color: #4ad4ff; }
      /* Holds a unit now ("−4.5 V", "250 mV") rather than a bare number, so it
         is a little wider and right-aligned; red while it holds a value the
         field's own range refuses. */
      .pnum {
        width: 74px; background: #0f1419; color: #e8f2f8; border: 1px solid #3c4653;
        border-radius: 3px; padding: 1px 4px; font: inherit; outline: none;
        text-align: right;
      }
      .pnum:focus { border-color: #4ad4ff; }
      .pnum.bad { border-color: #ff8f8f; color: #ff8f8f; }
      .ptog {
        background: #262e37; color: #93a6b3; border: 1px solid #3c4653; border-radius: 3px;
        font: 10px ui-monospace, monospace; padding: 2px 5px; cursor: pointer; white-space: nowrap;
      }
      .ptog:hover { background: #313b46; color: #e6f4fb; }
      .pknob {
        position: relative; width: 34px; height: 34px; border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #47525f, #1d232a 70%);
        border: 1px solid #55626f; box-shadow: inset 0 1px 0 #ffffff1c, 0 2px 5px #0008;
        cursor: ns-resize; touch-action: none; flex: 0 0 auto;
      }
      .pknob i {
        position: absolute; left: 50%; top: 3px; width: 2px; height: 13px; margin-left: -1px;
        background: #4ad4ff; border-radius: 1px; transform-origin: 50% 14px;
        box-shadow: 0 0 6px #4ad4ff;
      }
      .pswitch {
        min-width: 52px; background: #262e37; color: #93a6b3; border: 1px solid #3c4653;
        border-radius: 4px; font: 600 11px ui-monospace, monospace; letter-spacing: 0.1em;
        padding: 4px 8px; cursor: pointer;
      }
      .pswitch:hover { background: #313b46; }
      .pswitch.on {
        background: #14463a; color: #7dffb0; border-color: #2f7f63;
        box-shadow: inset 0 0 10px #7dffb033;
      }
      .pdot {
        width: 16px; height: 16px; border-radius: 50%; background: #ffd66b;
        border: 1px solid #00000055; flex: 0 0 auto;
      }
      .pseg {
        font: 700 15px/1.1 ui-monospace, monospace; letter-spacing: 0.06em;
        font-variant-numeric: tabular-nums; text-shadow: 0 0 9px currentColor;
      }
      /* Oscilloscope row: header line + a full-width trace canvas below it.
         No border/padding on the canvas — scope.ts hit-tests its own box. */
      .prow-scope { padding-bottom: 6px; }
      .pscope {
        flex: 1 0 100%; width: 100%; height: 120px; display: block; margin-top: 4px;
        background: #0b0d11; border-radius: 4px; touch-action: none;
      }
      .pchans { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; flex: 0 1 auto; }
      .pchan {
        width: 13px; height: 13px; padding: 0; border-radius: 50%; cursor: pointer;
        background: transparent; border: 1.5px solid currentColor;
      }
      .pchan.on { background: currentColor; box-shadow: 0 0 7px currentColor; }

      /* ---- goal card: the hoist's objective readout (hoist.ts owns it) ----
         Same instrument-window language as .pwin, screen-anchored bottom
         right, above the scope dock. Hidden until a machine message lands. */
      .goalcard {
        position: fixed; right: calc(12px + var(--rail-r)); bottom: 36px; width: 300px; z-index: 20;
        color: #c9d6de; font: 12px/1.5 ui-monospace, monospace;
        background: linear-gradient(#232830, #171b21);
        border: 1px solid #3c4653; border-radius: 8px;
        box-shadow: 0 10px 28px #000a, inset 0 1px 0 #ffffff14;
      }
      .goal-hd {
        display: flex; align-items: center; gap: 6px; padding: 5px 8px;
        border-bottom: 1px solid #2c343d; cursor: pointer;
        background: linear-gradient(#2b323c, #212730); border-radius: 7px 7px 0 0;
      }
      .goalcard.collapsed .goal-hd { border-bottom: none; border-radius: 7px; }
      .goal-hd:hover { background: linear-gradient(#333b47, #262d37); }
      .goal-caret { color: #6f8290; flex: none; }
      .goal-title {
        font: 600 12px ui-monospace, monospace; letter-spacing: 0.06em;
        color: #dff0f8; flex: 1 1 auto; min-width: 0;
      }
      .goal-badge {
        flex: none; font: 700 10px ui-monospace, monospace; letter-spacing: 0.1em;
        color: #93a6b3; background: #262e37; border: 1px solid #3c4653;
        border-radius: 3px; padding: 1px 5px;
      }
      .goal-badge.in { color: #7dffb0; background: #14463a; border-color: #2f7f63; }
      .goal-badge.win { color: #ffe6a1; background: #4a3a12; border-color: #a9862f; }
      .goal-body { padding: 8px; }
      .goalcard.collapsed .goal-body { display: none; }
      .goal-bar {
        position: relative; height: 22px; background: #0b0f13;
        border: 1px solid #3c4653; border-radius: 4px; overflow: hidden;
      }
      .goal-fill {
        position: absolute; left: 0; top: 0; bottom: 0; width: 0;
        background: linear-gradient(#3fd08a, #1c8f5c);
        box-shadow: 0 0 12px #3fd08a55;
      }
      .goal-bartext {
        position: absolute; inset: 0; display: flex; align-items: center;
        justify-content: center; font: 700 12px ui-monospace, monospace;
        letter-spacing: 0.06em; color: #eaf6ff; text-shadow: 0 1px 2px #000a;
        font-variant-numeric: tabular-nums;
      }
      .goal-grid {
        display: grid; grid-template-columns: 1fr 1fr; gap: 2px 10px; margin-top: 8px;
      }
      .goal-cell { display: flex; justify-content: space-between; gap: 6px; }
      .goal-cell b {
        font-weight: 400; color: #8ea3b1; font-size: 11px; letter-spacing: 0.04em;
      }
      .goal-cell span { color: #cfe3ee; font-variant-numeric: tabular-nums; }
      .goal-score {
        margin-top: 8px; padding: 5px 6px; border-radius: 4px;
        color: #ffe6a1; background: #40320f; border: 1px solid #a9862f;
        font-size: 11px; line-height: 1.4;
      }
      .goal-row { display: flex; gap: 6px; margin-top: 8px; }
      .goal-reset {
        flex: 1; background: #262e37; color: #c9d6de; border: 1px solid #3c4653;
        border-radius: 4px; padding: 4px 0; font: inherit; cursor: pointer;
      }
      .goal-reset:hover { background: #313b46; color: #fff; }
      .goal-hint {
        margin-top: 7px; color: #6d7d89; font-size: 11px; line-height: 1.35;
        white-space: pre-line;
      }
      /* Motor current over its nameplate rating: the number that explains
         why the motor is about to die. */
      .goal-cell span.over { color: #ff8f6a; font-weight: 600; }

      /* ---- the chip's datasheet: GOAL / PINOUT, opened by the package's
         own ⓘ badge. A machine has no editable values, so double-clicking it
         opens this instead of a property editor. */
      .goal-tabs {
        display: flex; gap: 4px; padding: 6px 8px 0;
        border-bottom: 1px solid #2c343d;
      }
      .goalcard.collapsed .goal-tabs { display: none; }
      .goal-tab {
        background: #1c222a; color: #8ea3b1; border: 1px solid #2c343d;
        border-bottom: none; border-radius: 4px 4px 0 0; padding: 3px 9px;
        font: 600 10px ui-monospace, monospace; letter-spacing: 0.1em;
        cursor: pointer;
      }
      .goal-tab:hover { color: #cfe3ee; }
      .goal-tab.on { background: #2b323c; color: #dff0f8; border-color: #3c4653; }
      .goal-pins { padding: 8px; }
      .goalcard.collapsed .goal-pins { display: none; }
      .goal-pin {
        display: grid; grid-template-columns: 46px 1fr; gap: 2px 8px;
        padding: 3px 0; border-bottom: 1px solid #232a32;
      }
      .goal-pin:last-child { border-bottom: none; }
      .goal-pin b {
        font: 700 11px ui-monospace, monospace; color: #dff0f8;
        letter-spacing: 0.04em;
      }
      .goal-pin i { font-style: normal; color: #8ea3b1; font-size: 11px; }
      .goal-pin u {
        grid-column: 2; text-decoration: none; color: #7fb4d0; font-size: 11px;
        font-variant-numeric: tabular-nums;
      }

      /* ---- damage toasts: "R7 released its magic smoke" (main.ts owns
         the elements; this is only their look). Bottom-left, above the
         scope dock, never in the way of the goal card. */
      #toasts {
        position: fixed; left: calc(12px + var(--rail-l)); z-index: 25;
        /* Lifted above the chat when chat has something to show — main.ts
           sets --toasts-b so the two bottom-left tenants never overlap. */
        bottom: var(--toasts-b, 36px);
        display: flex; flex-direction: column; gap: 6px;
        pointer-events: none; max-width: 430px;
      }
      .toast {
        color: #ffd8c2; background: linear-gradient(#2a1f1c, #1d1614);
        border: 1px solid #7a4030; border-left: 3px solid #ff6a3d;
        border-radius: 6px; padding: 6px 10px;
        font: 12px/1.45 ui-monospace, monospace;
        box-shadow: 0 8px 24px #000a;
        animation: toastin 180ms ease-out;
      }
      @keyframes toastin {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: none; }
      }

      /* ---- room chat (main.ts owns the elements; this is only their look).
         Bottom-left under the toasts, and QUIET: lines fade away after a few
         seconds, the input exists only while Enter has opened it, and nothing
         here ever swallows a pointer aimed at the schematic. */
      #chat {
        position: fixed; left: calc(12px + var(--rail-l)); bottom: 36px; z-index: 24;
        display: flex; flex-direction: column; gap: 3px;
        pointer-events: none; max-width: 430px; width: min(430px, 60vw);
        font: 12px/1.45 ui-monospace, monospace;
      }
      .cline {
        color: #c9d6de; background: #0d0d13cc;
        border: 1px solid #23232c; border-left: 3px solid var(--cwho, #8a8a98);
        border-radius: 4px; padding: 3px 8px;
        overflow-wrap: anywhere; /* a 240-char word must wrap, not escape */
        transition: opacity 600ms ease;
        animation: toastin 140ms ease-out;
      }
      .cline.faded { opacity: 0; }
      .cline.gone { display: none; }
      /* While the input is open the whole tail is readable again. */
      #chat.open .cline { display: block; opacity: 1; }
      .cline .cwho { color: var(--cwho, #8a8a98); font-weight: 600; margin-right: 6px; }
      #chatinput {
        display: none; pointer-events: auto; width: 100%; box-sizing: border-box;
        background: #0d0d13; color: #e8e8f0; margin-top: 3px;
        border: 1px solid #6a6a80; border-radius: 4px;
        padding: 3px 8px; font: inherit; outline: none;
      }
      #chat.open #chatinput { display: block; }
      #chatinput:focus { border-color: #8ee7ff; }

      /* Win: the card goes gold (the band flashes on the canvas). */
      .goalcard.win {
        border-color: #c9a34a;
        box-shadow: 0 10px 30px #000a, 0 0 22px #c9a34a44, inset 0 1px 0 #ffffff1f;
      }
      .goalcard.win .goal-hd { background: linear-gradient(#3d3418, #2a2513); }
      .goalcard.win .goal-title { color: #ffe6a1; }
      .goalcard.win .goal-fill { background: linear-gradient(#ffd76b, #c98f22); }

      /* ---- lesson card: the intro series' steps (lesson.ts owns it).
         Same instrument language as the goal card, anchored top-LEFT under
         the HUD so lesson 10 can show both cards at once. */
      .lessoncard {
        right: auto; bottom: auto;
        left: calc(12px + var(--rail-l)); top: 96px; width: 330px;
      }
      .lesson-step {
        display: flex; gap: 7px; align-items: flex-start;
        padding: 5px 2px; border-bottom: 1px solid #2a323c;
      }
      .lesson-step:last-child { border-bottom: none; }
      .lesson-step b {
        flex: none; width: 14px; text-align: center;
        color: #6f8290; font-weight: 600;
      }
      .lesson-step span { color: #cfe3ee; }
      .lesson-step.done b { color: #7dffb0; }
      .lesson-step.done span { color: #718899; }
      .lesson-step.now b { color: #8ee7ff; }
      .lesson-step.later b, .lesson-step.later span { color: #4c5c66; }
      .lesson-next { color: #ffe6a1; border-color: #a9862f; }
      .lesson-next:hover { background: #4a3a12; color: #ffefc4; }

      /* ---- rooms: which room am I in, and how do I get to another one
         (rooms.ts owns the elements; this is only their look).

         The chip wears the HUD's chrome — same plate, same border, same
         mono face — because it IS status, just status you can click. It
         lives in the top-right gutter #hud already reserves for itself
         (max-width: 100vw - 320px), so the two never collide. */
      #roomchip {
        position: fixed; top: 8px; right: 12px; z-index: 26;
        display: flex; align-items: center; gap: 7px; max-width: 300px;
        color: #c9c9d4; font: 12px/1.5 ui-monospace, monospace;
        background: #0d0d12d9; border: 1px solid #23232c; border-radius: 6px;
        padding: 4px 9px; cursor: pointer;
        user-select: none; -webkit-user-select: none;
      }
      #roomchip:hover { background: #17171f; border-color: #3a3a48; color: #fff; }
      #roomchip:focus-visible { outline: none; border-color: #4ad4ff; }
      #roomchip .rc-dot {
        width: 7px; height: 7px; border-radius: 50%; flex: none;
        background: #4bff6a; box-shadow: 0 0 6px #4bff6a99;
      }
      #roomchip.off .rc-dot { background: #6e6e7e; box-shadow: none; }
      #roomchip .rc-name {
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0;
      }
      #roomchip .rc-code { color: #7a7a8a; letter-spacing: 0.1em; flex: none; }
      #roomchip .rc-pop { color: #6e6e7e; flex: none; }

      /* The browser. First thing in the app with a real backdrop: it is
         modal on purpose — leaving a room is not an edit. */
      #roomdlg {
        position: fixed; inset: 0; z-index: 50; display: none;
        align-items: center; justify-content: center;
        background: #05050ac2;
        font: 13px/1.6 ui-monospace, monospace; color: #c9c9d4;
      }
      #roomdlg.open { display: flex; }
      .rdlg {
        width: min(780px, 94vw); max-height: 86vh; display: flex; flex-direction: column;
        background: #17171ef7; border: 1px solid #454558; border-radius: 8px;
        box-shadow: 0 18px 60px #000c;
      }
      .rdlg-hd {
        display: flex; align-items: center; gap: 10px;
        padding: 9px 10px 8px 12px; border-bottom: 1px solid #2c2c38;
      }
      .rdlg-hd h3 {
        margin: 0; font: 600 13px ui-monospace, monospace; color: #fff;
        letter-spacing: 0.12em; flex: none;
      }
      .rtabs { display: flex; gap: 4px; }
      .rtab {
        background: #22222c; color: #9a9aa5; border: 1px solid #3a3a48;
        border-radius: 4px; padding: 3px 9px; font: inherit; cursor: pointer;
      }
      .rtab:hover { background: #2e2e3c; color: #fff; }
      .rtab:focus-visible { outline: none; border-color: #4ad4ff; }
      .rtab.on { background: #14303a; color: #8ee7ff; border-color: #2f6a7f; }
      .rdlg-x {
        margin-left: auto; background: none; border: none; color: #8a8a98;
        font: 16px/1 ui-monospace, monospace; padding: 0 3px; cursor: pointer;
      }
      .rdlg-x:hover { color: #fff; }
      .rdlg-body { padding: 10px 12px; overflow: auto; flex: 1 1 auto; }
      .rdlg-ft {
        border-top: 1px solid #2c2c38; padding: 9px 12px;
        display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
      }
      .rmsg { color: #8a8a98; font-size: 11px; flex: 1 1 200px; min-height: 16px; }
      .rmsg.bad { color: #ff8f8f; }
      .rmsg.good { color: #7dffb0; }
      .rlead { color: #9a9aa5; font-size: 11.5px; line-height: 1.5; margin-bottom: 9px; }
      .rempty { color: #6e6e7e; padding: 18px 2px; text-align: center; }

      /* One room per row: identity on the left (the whole strip joins), the
         two destructive-ish verbs parked on the right. */
      .rrow {
        display: flex; align-items: center; gap: 6px; margin-bottom: 6px;
        background: #12121a; border: 1px solid #2c2c38; border-radius: 6px;
      }
      .rrow.here { background: #12211c; border-color: #2f7f63; }
      .rjoin {
        flex: 1 1 auto; min-width: 0; text-align: left; background: none;
        border: none; color: inherit; font: inherit; padding: 7px 9px;
        cursor: pointer; border-radius: 6px 0 0 6px;
      }
      .rjoin:hover, .rjoin:focus-visible { background: #20202c; color: #fff; outline: none; }
      .rjoin:disabled { cursor: default; }
      .rjoin:disabled:hover { background: none; }
      .rrow .rn { display: flex; align-items: center; gap: 8px; color: #e8e8ef; }
      .rrow .rnm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .rrow .rmeta { color: #6e6e7e; font-size: 11px; }
      .rhere, .rtag {
        flex: none; font: 700 10px ui-monospace, monospace; letter-spacing: 0.1em;
        border-radius: 3px; padding: 1px 5px;
      }
      .rhere { color: #7dffb0; background: #14463a; border: 1px solid #2f7f63; }
      .rtag { color: #ffe6a1; background: #40320f; border: 1px solid #a9862f; }
      .ract { display: flex; gap: 6px; align-items: center; padding-right: 8px; flex: none; }
      .rwarn { color: #ffb3b3; font-size: 11px; }
      .rbtn {
        background: #22222c; color: #c9c9d4; border: 1px solid #3a3a48;
        border-radius: 4px; padding: 3px 9px; font: inherit; cursor: pointer;
      }
      .rbtn:hover { background: #2e2e3c; color: #fff; }
      .rbtn:focus-visible { outline: none; border-color: #4ad4ff; }
      .rbtn:disabled { opacity: 0.45; cursor: default; }
      .rbtn:disabled:hover { background: #22222c; color: #c9c9d4; }
      .rbtn.go { background: #14303a; color: #8ee7ff; border-color: #2f6a7f; }
      .rbtn.go:hover { background: #1b3f4c; color: #fff; }
      .rbtn.danger { background: #2a1c1c; color: #ffb3b3; border-color: #6a3a3a; }
      .rbtn.danger:hover { background: #3a2222; color: #fff; }
      .rinput {
        width: 150px; background: #0f0f14; color: #e8e8ef; border: 1px solid #3a3a48;
        border-radius: 4px; padding: 3px 6px; font: inherit; outline: none;
      }
      .rinput.wide { width: 260px; max-width: 46vw; }
      .rinput:focus { border-color: #4ad4ff; }
      .rmake { display: flex; gap: 8px; align-items: center; flex: none; }

      /* Template cards: the .pwin cyan ring marks the pick, so "selected"
         means the same thing here as it does on an instrument. */
      .tgrid {
        display: grid; gap: 8px;
        grid-template-columns: repeat(auto-fill, minmax(224px, 1fr));
      }
      .tcard {
        position: relative; text-align: left; font: inherit; color: inherit;
        background: #12121a; border: 1px solid #2c2c38; border-radius: 6px;
        /* room at the bottom-right for the delete × on saved templates */
        padding: 8px 9px 9px; cursor: pointer;
      }
      .tcard:hover { background: #181822; border-color: #3a3a48; }
      .tcard.on, .tcard:focus-visible {
        outline: none; border-color: #4ad4ff;
        box-shadow: 0 0 0 1px #4ad4ff55, 0 0 16px #4ad4ff1f;
      }
      .tcard .tn {
        display: flex; align-items: baseline; gap: 8px; color: #dff0f8; font-weight: 600;
      }
      .tcard .tsrc {
        margin-left: auto; flex: none; color: #6e6e7e;
        font: 10px ui-monospace, monospace; letter-spacing: 0.08em;
      }
      .tcard .tb { color: #9a9aa5; font-size: 11px; line-height: 1.45; margin: 4px 0 7px; }
      .tcard .ts { color: #6e6e7e; font-size: 10.5px; padding-right: 16px; }
      .tdel {
        position: absolute; right: 4px; bottom: 3px; background: none; border: none;
        color: #5a5a68; font: 14px/1 ui-monospace, monospace; padding: 0 3px; cursor: pointer;
      }
      .tdel:hover { color: #ff8f8f; }
      .tconfirm {
        display: flex; align-items: center; gap: 6px; margin-top: 6px;
        color: #ffb3b3; font-size: 11px;
      }
      .rlabel {
        color: #8a8a98; font-size: 11px; letter-spacing: 0.06em; margin: 8px 0 3px;
      }
      .rkeep, .rdrop { margin: 0 0 4px; padding-left: 18px; font-size: 11.5px; }
      .rkeep li { color: #9ad6b6; }
      .rdrop li { color: #c8a98a; }
      .rform {
        display: flex; flex-direction: column; gap: 7px;
        margin-top: 12px; padding-top: 10px; border-top: 1px solid #2c2c38;
      }
      .rfield { display: flex; align-items: center; gap: 8px; }
      .rfield > span { flex: 0 0 96px; color: #8a8a98; font-size: 11.5px; }
      /* The text inputs own the rest of the row rather than sitting at a
         fixed 150px with dead space beside them. */
      .rfield .rinput { flex: 1 1 auto; width: auto; max-width: 420px; }
      /* The checkbox row reads left-to-right: box, then its sentence — the
         96px label column would otherwise wrap the sentence into a stripe. */
      .rcheck { cursor: pointer; }
      .rcheck > input { flex: none; accent-color: #4ad4ff; }
      .rcheck > span { flex: 1 1 auto; color: #8a8a98; font-size: 11.5px; }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <input id="nameedit" type="text" autocomplete="off" spellcheck="false" />
    <div id="hud"></div>
    <div id="scope" class="collapsed">
      <div id="scopebar"><span id="scopecaret">scope ▴</span><span id="scopesum"></span><span
          id="scopeaudio"
        ><button id="audiomute" type="button" title="mute all sound">sound ◂</button><input
            id="audiovol"
            type="range"
            min="0"
            max="100"
            step="1"
            title="volume"
            aria-label="volume"
          /><span id="audiolabel"></span></span><span id="audiobuf"></span></div>
      <canvas id="scopecv"></canvas>
    </div>
    <div id="props"></div>
    <div id="propsdlg"></div>
    <div id="ctxmenu"></div>
    <div id="rail-left" class="rail">
      <button class="rail-bar" type="button" aria-expanded="true" aria-controls="rail-left-list"><span
          class="rail-caret"
        >◂</span><span class="rail-count"></span></button>
      <div class="rail-list" id="rail-left-list"><div class="rail-caretline"></div></div>
      <div class="rail-grip" title="drag to resize this sidebar"></div>
    </div>
    <div id="rail-right" class="rail">
      <button class="rail-bar" type="button" aria-expanded="true" aria-controls="rail-right-list"><span
          class="rail-caret"
        >▸</span><span class="rail-count"></span></button>
      <div class="rail-list" id="rail-right-list"><div class="rail-caretline"></div></div>
      <div class="rail-grip" title="drag to resize this sidebar"></div>
    </div>
    <div id="panels"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
