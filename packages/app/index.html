<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EE Game — M1 demo</title>
    <style>
      html, body { margin: 0; height: 100%; background: #101014; overflow: hidden; }
      #canvas { display: block; width: 100vw; height: 100vh; cursor: default; }
      #hud {
        position: fixed; top: 10px; left: 12px; color: #9a9aa5;
        font: 12px/1.5 ui-monospace, monospace; pointer-events: none;
        white-space: pre;
      }
      #tip {
        position: fixed; display: none; color: #e8e8ef; background: #1c1c24e6;
        border: 1px solid #33333f; border-radius: 4px; padding: 6px 8px;
        font: 12px/1.5 ui-monospace, monospace; pointer-events: none;
        white-space: pre;
      }
      #scope {
        position: fixed; left: 0; right: 0; bottom: 0; height: 190px;
        display: none; background: #101016f2; border-top: 1px solid #2c2c38;
      }
      #scopecv { width: 100%; height: 100%; display: block; }
      #props, #propsdlg {
        position: fixed; width: 240px; display: none;
        background: #16161de6; border: 1px solid #33333f; border-radius: 6px;
        padding: 10px; font: 13px/1.7 ui-monospace, monospace; color: #c9c9d4;
      }
      #props { top: 54px; right: 12px; }
      /* Floating editor: same box, parked next to the part by double-click. */
      #propsdlg {
        left: 0; top: 0; z-index: 30; background: #17171ef7;
        border-color: #454558; box-shadow: 0 8px 28px #000a;
      }
      #props h3, #propsdlg h3 {
        margin: 0 0 6px; font-size: 13px; color: #fff; font-weight: 600;
        display: flex; justify-content: space-between; align-items: center; gap: 8px;
      }
      #props label, #propsdlg label {
        display: flex; justify-content: space-between; align-items: center; gap: 8px;
      }
      #props input[type=number], #props input[type=text],
      #propsdlg input[type=number], #propsdlg input[type=text] {
        width: 110px; background: #0f0f14; color: #e8e8ef; border: 1px solid #3a3a48;
        border-radius: 4px; padding: 2px 6px; font: inherit; outline: none;
      }
      #props .row, #propsdlg .row { display: flex; gap: 6px; margin-top: 8px; }
      #props button, #propsdlg button {
        flex: 1; background: #22222c; color: #c9c9d4; border: 1px solid #3a3a48;
        border-radius: 4px; padding: 4px 0; font: inherit; cursor: pointer;
      }
      #props button:hover, #propsdlg button:hover { background: #2e2e3c; color: #fff; }
      #propsdlg h3 .xbtn {
        flex: 0 0 auto; background: none; border: none; color: #8a8a98;
        font: 16px/1 ui-monospace, monospace; padding: 0 2px; cursor: pointer;
      }
      #propsdlg h3 .xbtn:hover { background: none; color: #fff; }
      /* Cascading context menu: a transparent layer holding one panel per level. */
      #ctxmenu { position: fixed; inset: 0; display: none; z-index: 40; pointer-events: none; }
      #ctxmenu .ctxpanel {
        position: absolute; pointer-events: auto; min-width: 172px;
        background: #16161df7; border: 1px solid #33333f; border-radius: 6px;
        padding: 4px; font: 13px/1.6 ui-monospace, monospace;
        box-shadow: 0 8px 28px #000a;
      }
      #ctxmenu .mi {
        display: flex; align-items: center; gap: 14px; justify-content: space-between;
        color: #c9c9d4; padding: 3px 8px; border-radius: 3px; cursor: pointer;
        white-space: nowrap;
      }
      #ctxmenu .mi:hover, #ctxmenu .mi.open { background: #2a2a3a; color: #fff; }
      /* Submenu rows get a caret and no keyboard-hint column. */
      #ctxmenu .mi.sub::after { content: '›'; color: #7a7a8a; font-size: 15px; line-height: 1; }
      #ctxmenu .mi.sub:hover::after, #ctxmenu .mi.open::after { color: #fff; }
      #ctxmenu .kb { color: #6e6e7e; font-size: 11px; }
      #ctxmenu .mi:hover .kb { color: #a8a8b8; }
      #ctxmenu .hd { color: #6e6e7e; padding: 2px 8px 4px; font-size: 11px; }
      #ctxmenu .sep { height: 1px; background: #2c2c38; margin: 4px 2px; }

      /* ---- control panels: floating instrument windows (panel.ts) ---- */
      #panels { position: fixed; inset: 0; pointer-events: none; }
      .pwin {
        position: absolute; pointer-events: auto; width: 300px; color: #c9d6de;
        font: 12px/1.5 ui-monospace, monospace;
        background: linear-gradient(#232830, #171b21);
        border: 1px solid #3c4653; border-radius: 8px;
        box-shadow: 0 10px 28px #000a, inset 0 1px 0 #ffffff14;
      }
      .pwin-hd {
        display: flex; align-items: center; gap: 6px; padding: 5px 6px 5px 8px;
        cursor: move; border-bottom: 1px solid #2c343d;
        background: linear-gradient(#2b323c, #212730);
        border-radius: 7px 7px 0 0; position: relative;
      }
      .pwin-grab { color: #5d6b78; cursor: move; }
      /* The name field is sized to its text by panel.ts (never flex: 1), so
         the header space to its right is real, grabbable title bar. */
      .pwin-title, .pwin-mez {
        font: 600 12px ui-monospace, monospace; letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .pwin-title {
        flex: 0 0 auto; width: 96px; min-width: 0; background: transparent;
        border: 1px solid transparent; border-radius: 3px; color: #dff0f8;
        padding: 1px 4px; outline: none; cursor: text;
      }
      .pwin-title:hover { border-color: #3c4653; }
      .pwin-title:focus { border-color: #4ad4ff; background: #10151a; text-transform: none; }
      /* Hidden twin: measuring the name is what keeps the drag strip exactly
         where the text ends as the panel is renamed. */
      .pwin-mez {
        position: absolute; left: 0; top: 0; visibility: hidden; white-space: pre;
        pointer-events: none; padding: 0; border: 0;
      }
      .pwin-mez.raw { text-transform: none; }
      .pwin-x {
        background: none; border: none; color: #6f8290; font: 15px/1 ui-monospace, monospace;
        cursor: pointer; padding: 0 3px; margin-left: auto;
      }
      .pwin-x:hover { color: #ff8f8f; }
      .pwin-body { padding: 4px 0; }
      .pwin-hint { display: none; padding: 6px 10px 9px; color: #6d7d89; font-size: 11px; }
      .prow {
        display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
        padding: 4px 8px 4px 4px; border-bottom: 1px solid #232a32;
      }
      .prow:last-child { border-bottom: none; }
      .prow.dragging { background: #2b3a44; }
      .prow-grip { color: #4e5c68; cursor: grab; padding: 0 2px; touch-action: none; }
      .prow-grip:hover { color: #8fa2b0; }
      .prow-label { flex: 0 0 82px; color: #8ea3b1; font-size: 11px; letter-spacing: 0.04em; }
      .prow-ctl { flex: 1 1 110px; display: flex; align-items: center; gap: 6px; min-width: 0; }
      .prow-val {
        flex: 0 0 auto; min-width: 76px; text-align: right; color: #cfe3ee;
        font-variant-numeric: tabular-nums;
      }
      .pslider { flex: 1 1 auto; min-width: 60px; accent-color: #4ad4ff; }
      .pnum {
        width: 62px; background: #0f1419; color: #e8f2f8; border: 1px solid #3c4653;
        border-radius: 3px; padding: 1px 4px; font: inherit; outline: none;
      }
      .pnum:focus { border-color: #4ad4ff; }
      .ptog {
        background: #262e37; color: #93a6b3; border: 1px solid #3c4653; border-radius: 3px;
        font: 10px ui-monospace, monospace; padding: 2px 5px; cursor: pointer; white-space: nowrap;
      }
      .ptog:hover { background: #313b46; color: #e6f4fb; }
      .pknob {
        position: relative; width: 34px; height: 34px; border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #47525f, #1d232a 70%);
        border: 1px solid #55626f; box-shadow: inset 0 1px 0 #ffffff1c, 0 2px 5px #0008;
        cursor: ns-resize; touch-action: none; flex: 0 0 auto;
      }
      .pknob i {
        position: absolute; left: 50%; top: 3px; width: 2px; height: 13px; margin-left: -1px;
        background: #4ad4ff; border-radius: 1px; transform-origin: 50% 14px;
        box-shadow: 0 0 6px #4ad4ff;
      }
      .pswitch {
        min-width: 52px; background: #262e37; color: #93a6b3; border: 1px solid #3c4653;
        border-radius: 4px; font: 600 11px ui-monospace, monospace; letter-spacing: 0.1em;
        padding: 4px 8px; cursor: pointer;
      }
      .pswitch:hover { background: #313b46; }
      .pswitch.on {
        background: #14463a; color: #7dffb0; border-color: #2f7f63;
        box-shadow: inset 0 0 10px #7dffb033;
      }
      .pdot {
        width: 16px; height: 16px; border-radius: 50%; background: #ffd66b;
        border: 1px solid #00000055; flex: 0 0 auto;
      }
      .pseg {
        font: 700 15px/1.1 ui-monospace, monospace; letter-spacing: 0.06em;
        font-variant-numeric: tabular-nums; text-shadow: 0 0 9px currentColor;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="hud"></div>
    <div id="tip"></div>
    <div id="scope"><canvas id="scopecv"></canvas></div>
    <div id="props"></div>
    <div id="propsdlg"></div>
    <div id="ctxmenu"></div>
    <div id="panels"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
