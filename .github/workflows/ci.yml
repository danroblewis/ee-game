name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Two architectures so the determinism harness compares
        # x86-64 vs aarch64 vs wasm32 across the matrix.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo install wasm-pack --locked || true
      - run: ./tools/determinism.sh
      - name: Upload hashes for cross-arch comparison
        run: cargo run --release -p sim-golden --bin hash | tee hashes-${{ matrix.os }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hashes-${{ matrix.os }}
          path: hashes-*.txt

  cross-arch-hashes:
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: |
          # Strip the leading circuit-name column ordering differences are
          # impossible (same binary layout), so plain diff suffices.
          diff hashes-ubuntu-latest.txt hashes-macos-latest.txt
          echo "cross-arch hashes identical"

  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo install wasm-pack --locked || true
      - run: wasm-pack build crates/sim-wasm --target web --out-dir ../../packages/app/src/wasm
      - run: pnpm install
      - run: pnpm --filter @ee/app exec tsc -p tsconfig.json --noEmit
